# The Python test tooling (fsi_tools: the fixture generators and what they build and check
# with; fsi_tools/__init__.py lists the packages). Standard library only; run from this directory
# (python -m fsi_tools.fixtures.NAME, ...) or with it on PYTHONPATH. `cargo xtask test` runs ruff
# on it and its unit tests (tests/).
[project]
name = "fsi-tools"
version = "0.1.0"
description = "The fixture generators of fs-inspect and the checks they make"
requires-python = ">=3.11"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["fsi_tools*"]

[tool.setuptools.package-data]
# The test trees' data and anything else not Python.
"*" = ["*.sh", "*.toml", "*.json", "*.c", "*.txt"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "TID251"]

# One way to start a process: fsi_tools/core/system.py (run, popen), which records what ran and
# how it failed the same way everywhere.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"subprocess".msg = "start processes through fsi_tools.core.system (run, popen)"

[tool.ruff.lint.per-file-ignores]
"fsi_tools/core/system.py" = ["TID251"]

[tool.ruff.lint.isort]
known-first-party = ["fsi_tools"]
