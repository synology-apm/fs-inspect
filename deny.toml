# `cargo deny check`, run by `cargo xtask deps` (and `test --job deps`, CI's deps job): the
# licenses of the dependencies, advisories against them, duplicate versions and where crates come
# from.

[graph]
all-features = true

[advisories]
# An unmaintained crate fails the check only when a workspace crate depends on it directly;
# one deeper in the tree is not reported.
unmaintained = "workspace"

[licenses]
# Permissive licenses only, plus MPL-2.0 (file-level copyleft: the crate's own files stay
# open, a binary linking it may be proprietary).
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    "0BSD",
]
confidence-threshold = 0.9

[licenses.private]
# This workspace's own crates (publish = false; Apache-2.0, LICENSE).
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
