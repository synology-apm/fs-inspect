[package]
name = "fs-inspect-ntfs"
description = "NTFS: on-disk format, allocation map, path lookup and change tracking (USN journal)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[features]
# Change tracking (`track`): the fs-inspect-change contract.
change = ["dep:fs-inspect-change"]
# Synthetic volumes built from a model (tests and test tools; fs-inspect-testkit re-exports them).
synth = []

[dependencies]
fs-inspect-io.workspace = true
fs-inspect-core.workspace = true
fs-inspect-codec.workspace = true
fs-inspect-change = { workspace = true, optional = true }
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
smallvec.workspace = true

[dev-dependencies]
fs-inspect-change = { workspace = true, features = ["test-util"] }
fs-inspect-io = { workspace = true, features = ["test-util"] }
fs-inspect-testkit.workspace = true
proptest.workspace = true
sha2.workspace = true

[[test]]
name = "track_fixtures"
required-features = ["change"]

[lints]
workspace = true
