[package]
name = "fs-inspect-xfs"
description = "XFS: on-disk format, allocation map and change tracking"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[features]
# Change tracking (`track`): the fs-inspect-change contract.
change = ["dep:fs-inspect-change"]
# The synthetic image builder (`synth`) for use outside this crate's own tests.
synth = []

[dependencies]
fs-inspect-io.workspace = true
fs-inspect-core.workspace = true
fs-inspect-change = { workspace = true, optional = true }
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
fs-inspect-change = { workspace = true, features = ["test-util"] }
fs-inspect-io = { workspace = true, features = ["test-util"] }
fs-inspect-testkit.workspace = true
proptest.workspace = true

[[test]]
name = "track_fixtures"
required-features = ["change"]

[lints]
workspace = true
